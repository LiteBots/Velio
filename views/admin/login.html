<!doctype html>
<html lang="pl" class="no-js">
<head>
  <!--#include head-->
  <link rel="stylesheet" href="/assets/css/app.css?v={{V}}">
  <link rel="stylesheet" href="/assets/css/admin.css?v={{V}}">
</head>
<body class="{{BODY_CLASS}}">
  <main id="main" class="admin-login">
    <div class="admin-login-glow" aria-hidden="true"></div>
    <section class="admin-login-card">
      <div class="admin-login-brand">
        <img src="/assets/img/logo.svg" alt="" width="52" height="52">
        <div><b>velio<span>.</span></b><small>Panel administratora</small></div>
      </div>
      <form id="admin-login-form" class="auth-form" novalidate data-configured="{{PIN_CONFIGURED}}">
        <h1>Wpisz kod PIN</h1>
        <p class="auth-sub">Dostęp tylko dla właściciela VELIO. Kod jest ustawiony w zmiennej <code>ADMIN_PIN</code> na Railway. Każde logowanie trafia do dziennika zdarzeń.</p>
        <div class="field pin-field">
          <label for="a-pin">Kod PIN</label>
          <div class="pw-wrap"><input id="a-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="12" required placeholder="••••" aria-describedby="pin-hint"><button type="button" class="pw-toggle" aria-label="Pokaż kod"><i data-lucide="eye"></i></button></div>
          <div class="pin-dots" aria-hidden="true"></div>
          <small id="pin-hint" class="pw-hint">Po 5 błędnych próbach logowanie z tego urządzenia blokuje się na 15 minut.</small>
        </div>
        <label class="check-row"><input type="checkbox" name="remember"> Zapamiętaj to urządzenie (30 dni)</label>
        <div class="auth-error" role="alert" hidden></div>
        <button class="button button-coral button-block" type="submit"><i data-lucide="shield-check"></i> Wejdź do panelu</button>
      </form>
      <p class="admin-login-foot"><a href="/"><i data-lucide="arrow-left"></i> Strona VELIO</a><span>·</span><a href="/logowanie">Panel klienta</a></p>
    </section>
  </main>
  <script src="/assets/js/admin-login.js?v={{V}}" defer></script>
</body>
</html>
