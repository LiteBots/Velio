<html lang="pl" class="no-js">
<head>
  <!--#include head-->
</head>
<body class="{{BODY_CLASS}}">
  <!--#include header-->
  <main id="main" class="site-main">
    <section class="quote-hero">
      <div class="wrap">
        {{CRUMBS}}
        <div class="quote-head reveal">
          <span class="section-kicker">Bezpłatna wycena</span>
          <h1>Opisz cel.<br><span class="serif">Zaproponujemy plan.</span></h1>
          <p class="lead-text">Pięć krótkich kroków, około dwóch minut. Odpowiadamy z zakresem, ceną i terminem — bez zobowiązań.</p>
        </div>
        <div class="config-inline reveal" id="config-modal" data-inline aria-labelledby="config-title">
          <!--#include configurator-->
        </div>
      </div>
    </section>
  </main>
  <!--#include footer-->
  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script src="/assets/js/site.js?v={{V}}" defer></script>
